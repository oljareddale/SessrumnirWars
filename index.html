<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

  /* Sidebar */
  .sidebar {

    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 4px 12px; }
  .brand-icon { color: #34d399; font-size: 22px; }
  .brand-title { font-size: 17px; font-weight: 600; color: #f1f5f9; }
  .section-lbl {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    color: #94a3b8; text-transform: uppercase; padding: 4px 4px 6px;
  }
  select, input[type="date"], input[type="month"], input[type="text"] {
    background-color: #111418;
    color: #e2e8f0;
    border: 1px solid #2f3744;
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
    color-scheme: dark;
  }
  select:focus, input:focus { border-color: #cbd5e1; }
  .sidebar select { width: 100%; margin-bottom: 14px; }
  .divider { height: 1px; background-color: #232933; margin: 8px 0 12px; }
  .nav-btn {
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: #94a3b8;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
    transition: background-color 0.12s, color 0.12s;
  }
  .nav-btn:hover { background-color: #1c222b; color: #e2e8f0; }
  .nav-btn.active { background-color: #222934; color: #f8fafc; font-weight: 600; }
  .status-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px;
    background-color: #12161b; border: 1px solid #232933;
    font-size: 11px; color: #94a3b8;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; flex-shrink: 0; }

  /* Main content */
  .main {
    flex: 1;
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-x: hidden;
  }
  .page-header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 14px;
  }
  .page-title { font-size: 24px; font-weight: 600; color: #f1f5f9; }
  .page-sub { font-size: 13px; color: #94a3b8; margin-top: 2px; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ctrl-group { display: flex; flex-direction: column; gap: 3px; }
  .ctrl-lbl { font-size: 11px; color: #94a3b8; }

  /* Cards & Grids */
  .card {
    background-color: #181c22;
    border: 1px solid #252c36;
    border-radius: 10px;
    padding: 16px 18px;
  }
  .kpi-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .kpi-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; }
  .kpi-val { font-size: 30px; font-weight: 700; margin-top: 4px; }
  .kpi-sub { font-size: 12px; color: #64748b; margin-top: 4px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .card-title { font-size: 14px; font-weight: 600; color: #e2e8f0; margin-bottom: 10px; }

  /* Buttons */
  .btn {
    background-color: #232933; color: #d8dee9; border: 1px solid #2f3744;
    border-radius: 6px; padding: 7px 12px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background-color 0.12s;
  }
  .btn:hover { background-color: #2c3442; }
  .btn-accent {
    background-color: #1e4d3b; color: #d1fae5; border: 1px solid #28664e;
  }
  .btn-accent:hover { background-color: #25614a; }

  /* Tables */
  .table-wrap {
    width: 100%; overflow-x: auto;
    background-color: #181c22; border: 1px solid #252c36; border-radius: 10px;
  }
  .card .table-wrap { border: none; border-radius: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    color: #9aa5b5; background-color: #15191f; font-weight: 600;
    padding: 9px 12px; border-bottom: 1px solid #252c36;
    white-space: nowrap; user-select: none;
  }
  thead th.sortable { cursor: pointer; }
  thead th.sortable:hover { color: #f1f5f9; }
  tbody td { padding: 8px 12px; border-bottom: 1px solid #222831; }
  tbody tr { transition: background-color 0.12s; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background-color: #202630; }
  tbody tr.row-selected { background-color: #1c332c !important; }
  tbody tr.row-selected td:first-child { box-shadow: inset 3px 0 0 #34d399; }
  .expand-row { background-color: #13171d !important; }
  .expand-row td { padding: 10px 14px; }
  .sub-table th { background: transparent; font-size: 11px; padding: 6px 8px; border-bottom: 1px solid #2c3442; }
  .sub-table td { font-size: 12px; padding: 6px 8px; border-bottom: 1px solid #1e242d; }

  .al { text-align: left; }
  .ac { text-align: center; }
  .ar { text-align: right; }
  .text-win { color: #34d399; font-weight: 500; }
  .text-loss { color: #f87171; font-weight: 500; }
  .text-muted { color: #94a3b8; }
  .text-light { color: #e2e8f0; }

  .pill-bar {
    display: flex; width: 96px; height: 8px; border-radius: 999px;
    overflow: hidden; background: #232933;
  }
  .pill-win { background: #34d399; height: 100%; }
  .pill-loss { background: #f87171; height: 100%; }
  .scroll-box { max-height: 400px; overflow-y: auto; }
  .empty-msg { padding: 20px; text-align: center; color: #94a3b8; font-size: 13px; }

  @media (max-width: 900px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid #232933; }
    .kpi-row, .grid-2 { grid-template-columns: 1fr; }
    .main { padding: 16px; }
  }
</style>

const todayISO = () => {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${mm}-${dd}`;
};

const st = {
  page: 'dashboard',
  kingdomId: DATA.default_kingdom_id != null ? String(DATA.default_kingdom_id) : (DATA.kingdoms[0] ? String(DATA.kingdoms[0].id) : ''),
  dashPeriod: 'Monthly',
  dashAnchor: todayISO(),
  memPeriod: 'All Time',
  memAnchor: todayISO(),
  memSelectedId: null,
  memExpandedOpp: null,
  memSort: { col: 'name', desc: false },
  memOrder: [],
  histPeriod: 'All Time',
  histAnchor: todayISO(),
  histOpponent: 'All Kingdoms',
  histWarId: null,
  histSort: { col: 'date', desc: true },
  histBattleSort: { col: 'side', desc: false },
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function pct(w, l) { return (w + l) ? (100 * w / (w + l)) : 0; }

function periodBounds(period, anchorISO) {
  if (period === 'All Time') return [null, null];
  const parts = (anchorISO || todayISO()).split('-').map(Number);
  const y = parts[0] || new Date().getFullYear();
  const m = parts[1] || 1;
  const d = parts[2] || 1;
  if (period === 'Weekly') {
    const dt = new Date(Date.UTC(y, m - 1, d));
    const dow = dt.getUTCDay(); // 0=Sun..6=Sat
    const s = new Date(dt.getTime() - dow * 86400000);
    const e = new Date(s.getTime() + 6 * 86400000);
    return [s.toISOString().slice(0, 10), e.toISOString().slice(0, 10)];
  }
  if (period === 'Monthly') {
    const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const mm = String(m).padStart(2, '0');
    return [`${y}-${mm}-01`, `${y}-${mm}-${String(last).padStart(2, '0')}`];
  }
  if (period === 'Yearly') {
    return [`${y}-01-01`, `${y}-12-31`];
  }
  return [null, null];
}

function inRange(dateStr, start, end) {
  if (!start || !end) return true;
  const d = (dateStr || '').slice(0, 10);
  return d >= start && d <= end;
}

function getKingdomName() {
  const k = DATA.kingdoms.find(x => String(x.id) === st.kingdomId);
  return k ? k.name : '';
}

function getWars(start, end) {
  return (DATA.wars[st.kingdomId] || []).filter(w => inRange(w.war_date, start, end));
}

function getBattles(start, end) {
  return (DATA.battles[st.kingdomId] || []).filter(b => inRange(b.war_date, start, end));
}

function getMembers() {
  return DATA.members[st.kingdomId] || [];
}

function statsByMember(battles) {
  const d = {};
  for (const b of battles) {
    const m = b.member_name || 'Unassigned';
    if (!d[m]) d[m] = { attack: { Win: 0, Loss: 0, 'No Action': 0, Unknown: 0 }, defense: { Win: 0, Loss: 0, 'No Action': 0, Unknown: 0 } };
    const side = (b.side || '').toLowerCase();
    if (d[m][side]) d[m][side][b.status] = (d[m][side][b.status] || 0) + 1;
  }
  return d;
}

function rankedTop5(stats, side = null) {
  const out = [];
  for (const [name, s] of Object.entries(stats)) {
    const w = side ? s[side].Win : (s.attack.Win + s.defense.Win);
    const l = side ? s[side].Loss : (s.attack.Loss + s.defense.Loss);
    if (w + l > 0) out.push({ name, w, l, tot: w + l, wr: pct(w, l) });
  }
  out.sort((a, b) => (b.wr - a.wr) || (b.tot - a.tot) || a.name.localeCompare(b.name));
  return out.slice(0, 5);
}

function sortRows(rows, col, desc) {
  return [...rows].sort((a, b) => {
    const va = a[col], vb = b[col];
    let cmp = (typeof va === 'number' && typeof vb === 'number')
      ? (va - vb)
      : String(va ?? '').localeCompare(String(vb ?? ''), undefined, { sensitivity: 'base' });
    return desc ? -cmp : cmp;
  });
}

function sortArrow(sortObj, col) {
  if (sortObj.col !== col) return '';
  return sortObj.desc ? ' &#9662;' : ' &#9652;';
}

function renderPeriodControls(periodKey, anchorKey) {
  const period = st[periodKey];
  const anchor = st[anchorKey] || todayISO();
  let pickerHtml = '';
  if (period === 'Weekly') {
    const [s, e] = periodBounds('Weekly', anchor);
    pickerHtml = `<div class="ctrl-group"><span class="ctrl-lbl">Week (${s} to ${e})</span><input type="date" id="anchor-inp" value="${esc(anchor)}"></div>`;
  } else if (period === 'Monthly') {
    pickerHtml = `<div class="ctrl-group"><span class="ctrl-lbl">Month</span><input type="month" id="anchor-inp" value="${esc(anchor.slice(0, 7))}"></div>`;
  } else if (period === 'Yearly') {
    const curY = Number(anchor.slice(0, 4)) || new Date().getFullYear();
    const years = new Set([curY]);
    for (const w of (DATA.wars[st.kingdomId] || [])) {
      const yr = Number((w.war_date || '').slice(0, 4));
      if (yr) years.add(yr);
    }
    const opts = [...years].sort((a, b) => b - a).map(y => `<option value="${y}" ${y === curY ? 'selected' : ''}>${y}</option>`).join('');
    pickerHtml = `<div class="ctrl-group"><span class="ctrl-lbl">Year</span><select id="anchor-inp">${opts}</select></div>`;
  }
  const periods = ['Weekly', 'Monthly', 'Yearly', 'All Time']
    .map(p => `<option value="${p}" ${p === period ? 'selected' : ''}>${p}</option>`).join('');
  return `${pickerHtml}<div class="ctrl-group"><span class="ctrl-lbl">Period</span><select id="period-sel">${periods}</select></div>`;
}

function bindPeriodControls(periodKey, anchorKey) {
  const ps = document.getElementById('period-sel');
  if (ps) ps.onchange = e => { st[periodKey] = e.target.value; render(); };
  const ai = document.getElementById('anchor-inp');
  if (ai) ai.onchange = e => {
    const v = e.target.value;
    if (st[periodKey] === 'Monthly') st[anchorKey] = v ? `${v}-01` : todayISO();
    else if (st[periodKey] === 'Yearly') st[anchorKey] = v ? `${v}-01-01` : todayISO();
    else st[anchorKey] = v || todayISO();
    render();
  };
}

function pillBarHtml(twr, totalBattles) {
  if (!totalBattles) return `<div class="pill-bar"></div>`;
  const w = Number(twr).toFixed(1);
  const l = (100 - Number(twr)).toFixed(1);
  return `<div class="pill-bar"><div class="pill-win" style="width:${w}%"></div><div class="pill-loss" style="width:${l}%"></div></div>`;
}

function renderDashboard() {
  const [start, end] = periodBounds(st.dashPeriod, st.dashAnchor);
  const wars = getWars(start, end);
  const battles = getBattles(start, end);
  const stats = statsByMember(battles);
  const kw = wars.filter(w => w.war_result === 'Won').length;
  const kl = wars.filter(w => w.war_result === 'Lost').length;
  const kd = wars.filter(w => w.war_result === 'Draw').length;
  const ktot = kw + kl + kd;

  const topTable = (title, list) => `
    <div class="card">
      <div class="card-title">${title}</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="ac">#</th><th class="al">Member</th><th class="ac">W</th><th class="ac">L</th><th class="ar">WR</th></tr></thead>
          <tbody>
            ${list.length ? list.map((r, i) => `
              <tr>
                <td class="ac">${i + 1}</td>
                <td class="al">${esc(r.name)}</td>
                <td class="ac text-win">${r.w}</td>
                <td class="ac text-loss">${r.l}</td>
                <td class="ar">${r.wr.toFixed(1)}%</td>
              </tr>`).join('') : `<tr><td colspan="5" class="empty-msg">No battles in this period.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;

  const oppMap = {};
  for (const w of wars) {
    const key = (w.opponent || '').trim() || '(Unknown)';
    if (!oppMap[key]) oppMap[key] = { w: 0, l: 0, d: 0, n: 0 };
    if (w.war_result === 'Won') oppMap[key].w++;
    else if (w.war_result === 'Lost') oppMap[key].l++;
    else if (w.war_result === 'Draw') oppMap[key].d++;
    oppMap[key].n++;
  }
  const oppRows = Object.entries(oppMap).sort((a, b) => a[0].localeCompare(b[0]));

  document.getElementById('app').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">War Statistics</div>
        <div class="page-sub">Overview for ${esc(getKingdomName() || 'your kingdom')}</div>
      </div>
      <div class="controls">${renderPeriodControls('dashPeriod', 'dashAnchor')}</div>
    </div>
    <div class="kpi-row">
      <div class="card">
        <div class="kpi-title">Kingdom Win Rate</div>
        <div class="kpi-val text-win">${ktot ? (100 * kw / ktot).toFixed(1) : '0.0'}%</div>
        <div class="kpi-sub">${kw} won</div>
      </div>
      <div class="card">
        <div class="kpi-title">Kingdom Loss Rate</div>
        <div class="kpi-val text-loss">${ktot ? (100 * kl / ktot).toFixed(1) : '0.0'}%</div>
        <div class="kpi-sub">${kl} lost</div>
      </div>
      <div class="card">
        <div class="kpi-title">Kingdom Draw Rate</div>
        <div class="kpi-val text-light">${ktot ? (100 * kd / ktot).toFixed(1) : '0.0'}%</div>
        <div class="kpi-sub">${kd} draws &bull; ${wars.length} wars</div>
      </div>
    </div>
    <div class="grid-2">
      ${topTable('Top 5 Overall', rankedTop5(stats))}
      ${topTable('Top 5 Defense', rankedTop5(stats, 'defense'))}
      ${topTable('Top 5 Attack', rankedTop5(stats, 'attack'))}
      <div class="card">
        <div class="card-title">Kingdom W / L / D by Opponent</div>
        <div class="table-wrap scroll-box">
          <table>
            <thead><tr><th class="al">Opponent</th><th class="ac">W</th><th class="ac">L</th><th class="ac">D</th><th class="ar">Win %</th></tr></thead>
            <tbody>
              ${oppRows.length ? oppRows.map(([o, g]) => `
                <tr>
                  <td class="al">${esc(o)}</td>
                  <td class="ac text-win">${g.w}</td>
                  <td class="ac text-loss">${g.l}</td>
                  <td class="ac text-muted">${g.d}</td>
                  <td class="ar">${(100 * g.w / g.n).toFixed(0)}%</td>
                </tr>`).join('') : `<tr><td colspan="5" class="empty-msg">No wars in this period.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  bindPeriodControls('dashPeriod', 'dashAnchor');
}

function renderMembers() {
  const [start, end] = periodBounds(st.memPeriod, st.memAnchor);
  const battles = getBattles(start, end);
  const stats = statsByMember(battles);
  const members = getMembers();

  let mRows = members.map(m => {
    const s = stats[m.name] || { attack: { Win: 0, Loss: 0, 'No Action': 0 }, defense: { Win: 0, Loss: 0, 'No Action': 0 } };
    const aw = s.attack.Win || 0, al = s.attack.Loss || 0, dna = s.attack['No Action'] || 0;
    const dw = s.defense.Win || 0, dl = s.defense.Loss || 0;
    return {
      id: m.id, name: m.name, aw, al, awr: Number(pct(aw, al).toFixed(1)),
      dna, dw, dl, dwr: Number(pct(dw, dl).toFixed(1)),
      twr: Number(pct(aw + dw, al + dl).toFixed(1)),
      tot: aw + al + dw + dl,
    };
  });
  mRows = sortRows(mRows, st.memSort.col, st.memSort.desc);
  st.memOrder = mRows.map(r => r.id);
  if (!st.memOrder.includes(st.memSelectedId)) {
    st.memSelectedId = st.memOrder[0] ?? null;
    st.memExpandedOpp = null;
  }

  const selMember = members.find(m => m.id === st.memSelectedId);
  let oppRows = [];
  if (selMember) {
    const grouped = {};
    for (const b of battles) {
      if (b.member_id !== selMember.id && b.member_name !== selMember.name) continue;
      const ok = (b.opponent || '').trim() || '(Unknown)';
      const op = (b.opponent_name || '').trim() || '(Unknown)';
      if (!grouped[ok]) grouped[ok] = { wars: new Set(), aw: 0, al: 0, dna: 0, dw: 0, dl: 0, players: {} };
      const g = grouped[ok];
      g.wars.add(b.war_id);
      if (!g.players[op]) g.players[op] = { aw: 0, al: 0, dna: 0, dw: 0, dl: 0 };
      const p = g.players[op];
      if (b.side === 'Attack') {
        if (b.status === 'Win') { g.aw++; p.aw++; }
        else if (b.status === 'Loss') { g.al++; p.al++; }
        else if (b.status === 'No Action') { g.dna++; p.dna++; }
      } else if (b.side === 'Defense') {
        if (b.status === 'Win') { g.dw++; p.dw++; }
        else if (b.status === 'Loss') { g.dl++; p.dl++; }
      }
    }
    oppRows = Object.entries(grouped)
      .sort((a, b) => (b[1].wars.size - a[1].wars.size) || a[0].localeCompare(b[0]))
      .map(([opp, g]) => ({
        opp, wars: g.wars.size, aw: g.aw, al: g.al, dna: g.dna, dw: g.dw, dl: g.dl,
        twr: Number(pct(g.aw + g.dw, g.al + g.dl).toFixed(1)),
        players: Object.entries(g.players)
          .sort((a, b) => ((b[1].aw + b[1].al + b[1].dw + b[1].dl) - (a[1].aw + a[1].al + a[1].dw + a[1].dl)) || a[0].localeCompare(b[0]))
          .map(([name, ps]) => ({
            name, ...ps,
            awr: Number(pct(ps.aw, ps.al).toFixed(1)),
            dwr: Number(pct(ps.dw, ps.dl).toFixed(1)),
            twr: Number(pct(ps.aw + ps.dw, ps.al + ps.dl).toFixed(1)),
            tot: ps.aw + ps.al + ps.dw + ps.dl,
          })),
      }));
  }

  const cols = [
    ['name', 'Member', 'al'], ['aw', 'Attack W', 'ar'], ['al', 'Attack L', 'ar'],
    ['awr', 'Attack Win %', 'ar'], ['dna', 'Did Not Attack', 'ar'],
    ['dw', 'Defense W', 'ar'], ['dl', 'Defense L', 'ar'],
    ['dwr', 'Defense Win %', 'ar'], ['twr', 'Total Win %', 'ar'],
  ];

  document.getElementById('app').innerHTML = `
    <div class="page-header">
      <div class="page-title">Members</div>
      <div class="controls">${renderPeriodControls('memPeriod', 'memAnchor')}</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            ${cols.map(([c, l, a]) => `<th class="${a} sortable" data-msort="${c}">${l}${sortArrow(st.memSort, c)}</th>`).join('')}
            <th class="al" style="min-width:110px;"></th>
          </tr>
        </thead>
        <tbody>
          ${mRows.length ? mRows.map(r => `
            <tr class="clickable ${r.id === st.memSelectedId ? 'row-selected' : ''}" data-mid="${r.id}">
              <td class="al">${esc(r.name)}</td>
              <td class="ar text-win">${r.aw}</td>
              <td class="ar text-loss">${r.al}</td>
              <td class="ar text-light">${r.awr.toFixed(1)}%</td>
              <td class="ar text-muted">${r.dna}</td>
              <td class="ar text-win">${r.dw}</td>
              <td class="ar text-loss">${r.dl}</td>
              <td class="ar text-light">${r.dwr.toFixed(1)}%</td>
              <td class="ar text-light">${r.twr.toFixed(1)}%</td>
              <td class="al">${pillBarHtml(r.twr, r.tot)}</td>
            </tr>`).join('') : `<tr><td colspan="10" class="empty-msg">No members found.</td></tr>`}
        </tbody>
      </table>
    </div>
    ${selMember ? `
    <div class="card">
      <div class="page-header" style="margin-bottom:10px;">
        <div class="card-title" style="margin:0;">${esc(selMember.name)} &mdash; Record vs. Opponent Kingdoms</div>
        <div class="page-sub" style="margin:0;">&uarr; &darr; switch member &bull; click a kingdom to expand opponents</div>
      </div>
      ${oppRows.length ? `
      <div class="table-wrap scroll-box">
        <table>
          <thead>
            <tr>
              <th class="al">Opponent Kingdom</th><th class="ac">Wars</th>
              <th class="ar">Attack W</th><th class="ar">Attack L</th><th class="ar">DNA</th>
              <th class="ar">Defense W</th><th class="ar">Defense L</th><th class="ar">Win %</th>
            </tr>
          </thead>
          <tbody>
            ${oppRows.map(o => {
              const exp = o.opp === st.memExpandedOpp;
              return `
                <tr class="clickable ${exp ? 'row-selected' : ''}" data-opp="${esc(o.opp)}">
                  <td class="al text-light"><span class="text-win" style="margin-right:8px;">${exp ? '&#9662;' : '&#9656;'}</span>${esc(o.opp)}</td>
                  <td class="ac">${o.wars}</td>
                  <td class="ar text-win">${o.aw}</td>
                  <td class="ar text-loss">${o.al}</td>
                  <td class="ar text-muted">${o.dna}</td>
                  <td class="ar text-win">${o.dw}</td>
                  <td class="ar text-loss">${o.dl}</td>
                  <td class="ar text-light">${o.twr.toFixed(1)}%</td>
                </tr>
                ${exp ? `
                <tr class="expand-row">
                  <td colspan="8">
                    <table class="sub-table">
                      <thead>
                        <tr>
                          <th class="al">Opponent</th><th class="ar">Attack W</th><th class="ar">Attack L</th>
                          <th class="ar">Attack Win %</th><th class="ar">Did Not Attack</th>
                          <th class="ar">Defense W</th><th class="ar">Defense L</th>
                          <th class="ar">Defense Win %</th><th class="ar">Total Win %</th><th class="al"></th>
                        </tr>
                      </thead>
                      <tbody>
                        ${o.players.map(p => `
                          <tr>
                            <td class="al text-light">${esc(p.name)}</td>
                            <td class="ar text-win">${p.aw}</td>
                            <td class="ar text-loss">${p.al}</td>
                            <td class="ar text-light">${p.awr.toFixed(1)}%</td>
                            <td class="ar text-muted">${p.dna}</td>
                            <td class="ar text-win">${p.dw}</td>
                            <td class="ar text-loss">${p.dl}</td>
                            <td class="ar text-light">${p.dwr.toFixed(1)}%</td>
                            <td class="ar text-light">${p.twr.toFixed(1)}%</td>
                            <td class="al">${pillBarHtml(p.twr, p.tot)}</td>
                          </tr>`).join('')}
                      </tbody>
                    </table>
                  </td>
                </tr>` : ''}`;
            }).join('')}
          </tbody>
        </table>
      </div>` : `<div class="empty-msg">No battles recorded for this member in the selected period.</div>`}
    </div>` : ''}`;

  bindPeriodControls('memPeriod', 'memAnchor');
  document.querySelectorAll('[data-msort]').forEach(th => {
    th.onclick = () => {
      const col = th.dataset.msort;
      st.memSort = { col, desc: st.memSort.col === col ? !st.memSort.desc : (col !== 'name') };
      render();
    };
  });
  document.querySelectorAll('[data-mid]').forEach(tr => {
    tr.onclick = () => { st.memSelectedId = Number(tr.dataset.mid); st.memExpandedOpp = null; render(); };
  });
  document.querySelectorAll('[data-opp]').forEach(tr => {
    tr.onclick = () => {
      const o = tr.dataset.opp;
      st.memExpandedOpp = (st.memExpandedOpp === o) ? null : o;
      render();
    };
  });
}

function renderHistory() {
  const allWars = DATA.wars[st.kingdomId] || [];
  const allBattles = DATA.battles[st.kingdomId] || [];

  // War Detail View (Read-Only)
  if (st.histWarId != null) {
    const war = allWars.find(w => w.id === st.histWarId);
    if (war) {
      const wb = allBattles.filter(b => b.war_id === war.id);
      const sideCounts = { Attack: 0, Defense: 0 };
      let bRows = wb
        .sort((a, b) => ((a.side === 'Attack' ? 0 : 1) - (b.side === 'Attack' ? 0 : 1)) || (a.row_index - b.row_index) || (a.id - b.id))
        .map(b => {
          sideCounts[b.side] = (sideCounts[b.side] || 0) + 1;
          return { side: b.side, row: sideCounts[b.side], member: b.member_name, opponent: b.opponent_name, status: b.status };
        });
      bRows = sortRows(bRows, st.histBattleSort.col, st.histBattleSort.desc);

      const resCls = war.war_result === 'Won' ? 'text-win' : (war.war_result === 'Lost' ? 'text-loss' : 'text-light');
      document.getElementById('app').innerHTML = `
        <div class="page-header">
          <div style="display:flex;align-items:center;gap:12px;">
            <button class="btn" id="back-btn">&larr; Back</button>
            <div>
              <div class="page-title">${esc(war.war_date)} vs ${esc(war.opponent || '(Unknown)')}</div>
              <div class="page-sub">Result: <span class="${resCls}">${esc(war.war_result)}</span> &bull; ${bRows.length} battles</div>
            </div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="ac sortable" data-bsort="side">Side${sortArrow(st.histBattleSort, 'side')}</th>
                <th class="ac sortable" data-bsort="row">#${sortArrow(st.histBattleSort, 'row')}</th>
                <th class="al sortable" data-bsort="member">Member${sortArrow(st.histBattleSort, 'member')}</th>
                <th class="al sortable" data-bsort="opponent">Opponent${sortArrow(st.histBattleSort, 'opponent')}</th>
                <th class="ac sortable" data-bsort="status">Status${sortArrow(st.histBattleSort, 'status')}</th>

                  <tr>
                    <td class="ac">${esc(r.side)}</td>
                    <td class="ac text-muted">${r.row}</td>
                    <td class="al">${esc(r.member)}</td>
                    <td class="al">${esc(r.opponent)}</td>
                    <td class="ac ${sc}">${esc(r.status)}</td>
                  </tr>`;
              }).join('') : `<tr><td colspan="5" class="empty-msg">No battles recorded for this war.</td></tr>`}

          </table>
        </div>`;
      document.getElementById('back-btn').onclick = () => { st.histWarId = null; render(); };
      document.querySelectorAll('[data-bsort]').forEach(th => {
        th.onclick = () => {
          const col = th.dataset.bsort;
          st.histBattleSort = { col, desc: st.histBattleSort.col === col ? !st.histBattleSort.desc : false };
          render();
        };
      });
      return;
    }
    st.histWarId = null;
  }

  // War List View
  const [start, end] = periodBounds(st.histPeriod, st.histAnchor);
  const periodWars = getWars(start, end);
  const oppSet = new Set();
  for (const w of periodWars) {
    const o = (w.opponent || '').trim();
    if (o) oppSet.add(o);
  }
  const oppOptions = ['All Kingdoms', ...[...oppSet].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }))];
  if (!oppOptions.includes(st.histOpponent)) st.histOpponent = 'All Kingdoms';

  for (const b of allBattles) battleCounts[b.war_id] = (battleCounts[b.war_id] || 0) + 1;

  let wRows = periodWars
    .filter(w => st.histOpponent === 'All Kingdoms' || (w.opponent || '').trim().toLowerCase() === st.histOpponent.toLowerCase())
    .map(w => ({ id: w.id, date: w.war_date, opponent: w.opponent, result: w.war_result, battles: battleCounts[w.id] || 0 }));
  wRows = sortRows(wRows, st.histSort.col, st.histSort.desc);

  const oppOptsHtml = oppOptions.map(o => `<option value="${esc(o)}" ${o === st.histOpponent ? 'selected' : ''}>${esc(o)}</option>`).join('');

  document.getElementById('app').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">War History</div>
        <div class="page-sub">Click any war to inspect its battles.</div>
      </div>
      <div class="controls">
        ${renderPeriodControls('histPeriod', 'histAnchor')}
        <div class="ctrl-group">
          <span class="ctrl-lbl">Opponent Kingdom</span>

        </div>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="ac sortable" data-hsort="date">Date${sortArrow(st.histSort, 'date')}</th>
            <th class="al sortable" data-hsort="opponent">Opponent${sortArrow(st.histSort, 'opponent')}</th>
            <th class="ac sortable" data-hsort="result">Result${sortArrow(st.histSort, 'result')}</th>
            <th class="ac sortable" data-hsort="battles">Battles${sortArrow(st.histSort, 'battles')}</th>
          </tr>
        </thead>
        <tbody>
          ${wRows.length ? wRows.map(w => {
            const rc = w.result === 'Won' ? 'text-win' : (w.result === 'Lost' ? 'text-loss' : 'text-muted');
            return `
              <tr class="clickable" data-wid="${w.id}">
                <td class="ac">${esc(w.date)}</td>
                <td class="al">${esc(w.opponent)}</td>
                <td class="ac ${rc}">${esc(w.result)}</td>
                <td class="ac">${w.battles}</td>
              </tr>`;
          }).join('') : `<tr><td colspan="4" class="empty-msg">No wars match the selected filters.</td></tr>`}
        </tbody>
      </table>
    </div>`;

  bindPeriodControls('histPeriod', 'histAnchor');
  document.getElementById('hist-opp-sel').onchange = e => { st.histOpponent = e.target.value; render(); };
  document.querySelectorAll('[data-hsort]').forEach(th => {
    th.onclick = () => {
      const col = th.dataset.hsort;
      st.histSort = { col, desc: st.histSort.col === col ? !st.histSort.desc : (col === 'date' || col === 'battles') };
      render();
    };
  });
  document.querySelectorAll('[data-wid]').forEach(tr => {
    tr.onclick = () => { st.histWarId = Number(tr.dataset.wid); render(); };
  });
}

function render() {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === st.page));
  if (st.page === 'dashboard') renderDashboard();
  else if (st.page === 'members') renderMembers();
  else if (st.page === 'history') renderHistory();
}

// Init sidebar
const kSel = document.getElementById('kingdom-select');
kSel.innerHTML = DATA.kingdoms.map(k => `<option value="${k.id}" ${String(k.id) === st.kingdomId ? 'selected' : ''}>${esc(k.name)}</option>`).join('');
kSel.onchange = e => {
  st.kingdomId = e.target.value;
  st.histWarId = null;
  st.histOpponent = 'All Kingdoms';
  st.memSelectedId = null;
  st.memExpandedOpp = null;
  render();
};
document.querySelectorAll('.nav-btn').forEach(b => {
  b.onclick = () => { st.page = b.dataset.page; render(); };
});
document.getElementById('updated-lbl').textContent = `Updated ${DATA.generated_at} • Read-Only`;

// Keyboard navigation on Members page
document.addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
  if (st.page === 'members' && st.memOrder.length) {
    const idx = st.memOrder.indexOf(st.memSelectedId);
    if (e.key === 'ArrowDown' && idx < st.memOrder.length - 1) {
      e.preventDefault(); st.memSelectedId = st.memOrder[idx + 1]; st.memExpandedOpp = null; render();
    } else if (e.key === 'ArrowUp' && idx > 0) {
      e.preventDefault(); st.memSelectedId = st.memOrder[idx - 1]; st.memExpandedOpp = null; render();
    }
  }
});

render();
</script>
</body>
</html>
