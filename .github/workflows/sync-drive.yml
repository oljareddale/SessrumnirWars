name: Sync index.html from Google Drive

on:
  schedule:
    # Runs daily at 18:00 UTC (12:00 PM CST)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual runs anytime from the Actions tab

permissions:
  contents: write

jobs:
  update-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download index.html from Google Drive
        run: |
          curl -fL "https://drive.google.com/uc?export=download&id=11aSrVfwlhxQLJiUaeLf4hcw6O9Ln-D58" -o index.html

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update index.html from Google Drive" && git push)
